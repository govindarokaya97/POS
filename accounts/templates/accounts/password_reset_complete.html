<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Password Updated | ABC POS</title>
</head>

<body class="flex min-h-screen items-center justify-center bg-[#F4F5F1] p-5 text-[#12141A]">

    <main class="w-full max-w-md rounded-2xl border border-[#E4E3DC] bg-white p-8 text-center shadow-xl">

        <div
            class="mx-auto mb-6 flex h-16 w-16 items-center justify-center rounded-2xl bg-[#157A5C] text-3xl text-white">
            ✓
        </div>

        <h1 class="text-2xl font-bold">
            Password Updated Successfully!
        </h1>

        <p class="mt-4 text-sm leading-7 text-gray-500">
            Your ABC POS account password has been changed successfully.
            You can now log in using your new password.
        </p>

        <a href="{% url 'login' %}"
            class="mt-8 block w-full rounded-xl bg-[#157A5C] px-5 py-3.5 font-semibold text-white transition hover:bg-[#0F5E46]">
            Continue to Login
        </a>

        <p class="mt-6 text-xs text-gray-400">
            ABC POS · Secure Account Management
        </p>

    </main>

</body>

</html>
