<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Check Your Email | POS System</title>
</head>

<body class="flex min-h-screen items-center justify-center bg-[#F4F5F1] p-5 text-[#12141A]">
    <main class="w-full max-w-md rounded-2xl border border-[#E4E3DC] bg-white p-8 text-center shadow-xl">
        <div
            class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-2xl bg-[#157A5C] text-3xl text-white">
            ✓
        </div>

        <h1 class="text-2xl font-bold">Check your email</h1>

        <p class="mt-4 text-sm leading-6 text-gray-500">
            If an active account exists with the email address you entered,
            password-reset instructions have been sent.
        </p>

        <p class="mt-3 text-sm text-gray-500">
            Please check your inbox and spam folder.
        </p>

        <a href="{% url 'login' %}"
            class="mt-7 inline-block rounded-xl bg-[#157A5C] px-6 py-3 font-semibold text-white hover:bg-[#0F5E46]">
            Return to Login
        </a>
    </main>
</body>

</html>
