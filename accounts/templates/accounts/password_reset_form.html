<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Forgot Password | POS System</title>
</head>

<body class="flex min-h-screen items-center justify-center bg-[#F4F5F1] p-5 text-[#12141A]">

    <main class="w-full max-w-md rounded-2xl border border-[#E4E3DC] bg-white p-8 shadow-xl">

        <div class="mb-6 flex h-14 w-14 items-center justify-center rounded-2xl bg-[#157A5C] text-2xl text-white">
            ↻
        </div>

        <h1 class="text-2xl font-bold">Forgot your password?</h1>

        <p class="mt-3 text-sm leading-6 text-gray-500">
            Enter the email address associated with your POS account.
            We will send you a secure password-reset link.
        </p>

        <form method="POST" class="mt-7 space-y-5">
            {% csrf_token %}

            <div>
                <label for="id_email" class="mb-2 block text-sm font-semibold">
                    Email address
                </label>

                <input type="email" name="email" id="id_email" required autofocus placeholder="you@example.com"
                    class="w-full rounded-xl border border-[#E4E3DC] px-4 py-3 outline-none transition focus:border-[#157A5C] focus:ring-2 focus:ring-[#157A5C]/10">

                {% if form.email.errors %}
                <p class="mt-2 text-sm text-red-600">
                    {{ form.email.errors }}
                </p>
                {% endif %}
            </div>

            <button type="submit"
                class="w-full rounded-xl bg-[#157A5C] px-5 py-3.5 font-semibold text-white transition hover:bg-[#0F5E46]">
                Send Reset Link
            </button>
        </form>

        <a href="{% url 'login' %}"
            class="mt-6 block text-center text-sm font-medium text-gray-500 hover:text-[#157A5C]">
            Back to Login
        </a>

    </main>
</body>

</html>
