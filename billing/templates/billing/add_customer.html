{% extends "base.html" %}


{% block title %}
Add Customer
{% endblock %}



{% block content %}


<div class="mx-auto max-w-2xl space-y-8">
    <div>
        <p class="font-mono text-xs uppercase tracking-[0.2em] text-muted">Billing</p>
        <h1 class="mt-1 font-display text-3xl font-semibold text-ink">
            Add Customer
        </h1>
    </div>



<form method="POST" class="space-y-4 rounded-xl border border-line bg-white p-6">


    {% csrf_token %}



    <input name="name" placeholder="Customer Name" />



    <input name="phone" placeholder="Phone Number" />



    <input name="email" placeholder="Email" />



    <textarea name="address" placeholder="Address"></textarea>




    <button class="rounded-lg bg-brand px-6 py-3 text-sm font-semibold text-white transition hover:bg-brand-dark">

        Save Customer

    </button>



</form>
</div>



{% endblock %}
