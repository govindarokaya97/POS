{% extends "base.html" %}


{% block title %}
Add Expense
{% endblock %}



{% block content %}


<div class="mx-auto max-w-2xl space-y-8">
    <div>
        <p class="font-mono text-xs uppercase tracking-[0.2em] text-muted">Expenses</p>
        <h1 class="mt-1 font-display text-3xl font-semibold text-ink">
            Add Expense
        </h1>
    </div>



<form method="POST" class="space-y-4 rounded-xl border border-line bg-white p-6">


    {% csrf_token %}



    <input name="title" placeholder="Expense title" />



    <select name="expense_type">


        <option value="rent">
            Rent
        </option>


        <option value="salary">
            Salary
        </option>


        <option value="electricity">
            Electricity
        </option>


        <option value="supplier">
            Supplier
        </option>


        <option value="other">
            Other
        </option>


    </select>




    <input name="amount" type="number" placeholder="Amount" class="font-mono tabular-nums" />




    <textarea name="description" placeholder="Description"></textarea>



    <button class="rounded-lg bg-brand px-6 py-3 text-sm font-semibold text-white transition hover:bg-brand-dark">

        Save Expense

    </button>



</form>
</div>


{% endblock %}
