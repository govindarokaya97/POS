{% extends "base.html" %}


{% block title %}
Add Category
{% endblock %}


{% block content %}


<div class="mx-auto max-w-xl">


    <div class="rounded-xl border border-line bg-white p-8">


        <h1 class="text-2xl font-semibold mb-6">
            Add Expense Category
        </h1>



        <form method="post" class="space-y-5">

            {% csrf_token %}



            <input name="name" placeholder="Category name" required class="w-full rounded-lg border px-4 py-3">




            <select name="group" required class="w-full rounded-lg border px-4 py-3">


                <option value="">
                    Select Group
                </option>


                <option value="cinema">
                    Cinema Hall
                </option>


                <option value="canteen">
                    Canteen
                </option>


                <option value="general">
                    General
                </option>


            </select>




            <button class="rounded-lg bg-brand px-6 py-3 text-white font-semibold">

                Save Category

            </button>


        </form>


    </div>


</div>


{% endblock %}
