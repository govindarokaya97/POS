{% extends "base.html" %}


{% block title %}
Add Expense
{% endblock %}



{% block content %}


<div class="mx-auto max-w-3xl">


    <div class="rounded-xl border border-line bg-white p-8">


        <div class="mb-6">

            <p class="font-mono text-xs uppercase tracking-[0.2em] text-muted">
                Finance
            </p>


            <h1 class="mt-1 font-display text-2xl font-semibold text-ink">
                Add Expense
            </h1>


            <p class="mt-1 text-sm text-muted">
                Record cinema hall, canteen and general business expenses.
            </p>

        </div>



        <form method="post" class="space-y-5">

            {% csrf_token %}



            <div>

                <label class="mb-2 block text-sm font-medium text-ink">
                    Expense Title
                </label>


                <input name="title" placeholder="Example: Projector Maintenance" required
                    class="w-full rounded-lg border border-line px-4 py-3">

            </div>





            <div>

                <label class="mb-2 block text-sm font-medium text-ink">
                    Category
                </label>


                <select name="category" required class="w-full rounded-lg border border-line px-4 py-3">


                    <option value="">
                        Select Category
                    </option>


                    {% for category in expense_categories %}

                    <option value="{{ category.id }}">

                        {{ category.name }}
                        ({{ category.get_group_display }})

                    </option>


                    {% endfor %}


                </select>


            </div>





            <div>

                <label class="mb-2 block text-sm font-medium text-ink">
                    Amount
                </label>


                <input type="number" step="0.01" name="amount" placeholder="Rs 0.00" required
                    class="w-full rounded-lg border border-line px-4 py-3">

            </div>





            <div>

                <label class="mb-2 block text-sm font-medium text-ink">
                    Description
                </label>


                <textarea name="description" rows="4" placeholder="Additional details..."
                    class="w-full rounded-lg border border-line px-4 py-3"></textarea>


            </div>





            <button
                class="inline-flex items-center gap-2 rounded-lg bg-brand px-6 py-3 font-semibold text-white hover:bg-brand-dark">


                <i class="fa-solid fa-save"></i>

                Save Expense


            </button>



        </form>


    </div>


</div>


{% endblock %}
