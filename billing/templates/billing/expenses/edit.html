{% extends "base.html" %}


{% block title %}
Edit Expense
{% endblock %}



{% block content %}


<div class="mx-auto max-w-3xl">


    <div class="rounded-xl border border-line bg-white p-8">


        <div class="mb-6">

            <p class="font-mono text-xs uppercase tracking-[0.2em] text-muted">
                Finance
            </p>


            <h1 class="mt-1 font-display text-2xl font-semibold text-ink">
                Edit Expense
            </h1>


            <p class="mt-1 text-sm text-muted">
                Update expense details and category information.
            </p>

        </div>




        <form method="post" class="space-y-5">

            {% csrf_token %}



            <!-- Title -->

            <div>

                <label class="mb-2 block text-sm font-medium text-ink">
                    Expense Title
                </label>


                <input name="title" value="{{ expense.title }}" required
                    class="w-full rounded-lg border border-line px-4 py-3">

            </div>





            <!-- Category -->

            <div>

                <label class="mb-2 block text-sm font-medium text-ink">
                    Category
                </label>



                <select name="category" required class="w-full rounded-lg border border-line px-4 py-3">


                    <option value="">
                        Select Category
                    </option>



                    {% for category in expense_categories %}

                    <option value="{{ category.id }}" {% if expense.category.id == category.id %} selected {% endif %}>

                        {{ category.name }}
                        ({{ category.get_group_display }})

                    </option>


                    {% endfor %}



                </select>


            </div>





            <!-- Amount -->

            <div>

                <label class="mb-2 block text-sm font-medium text-ink">
                    Amount
                </label>



                <input type="number" step="0.01" name="amount" value="{{ expense.amount }}" required
                    class="w-full rounded-lg border border-line px-4 py-3">


            </div>





            <!-- Description -->

            <div>

                <label class="mb-2 block text-sm font-medium text-ink">
                    Description
                </label>



                <textarea name="description" rows="4"
                    class="w-full rounded-lg border border-line px-4 py-3">{{ expense.description }}</textarea>


            </div>





            <div class="flex gap-3">


                <button
                    class="inline-flex items-center gap-2 rounded-lg bg-brand px-6 py-3 font-semibold text-white hover:bg-brand-dark">

                    <i class="fa-solid fa-save"></i>

                    Update Expense

                </button>

                <a href="{% url 'expense_list' %}"
                    class="rounded-lg border border-line px-6 py-3 font-semibold hover:bg-paper">

                    Cancel

                </a>


            </div>




        </form>



    </div>



</div>



{% endblock %}
