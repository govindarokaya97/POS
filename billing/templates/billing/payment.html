{% extends 'base.html' %}

{% block title %}
Payment
{% endblock %}


{% block content %}

<div class="max-w-xl mx-auto">

    <h1 class="text-3xl font-semibold">
        Payment
    </h1>


    <div class="mt-6 rounded-xl border bg-white p-6">


        <p>
            Total Amount
        </p>


        <h2 class="text-3xl font-bold text-brand">
            Rs {{ invoice.total }}
        </h2>


        <form method="post" class="mt-6 space-y-4">

            {% csrf_token %}


            <div>

                <label>
                    Payment Method
                </label>

                <select name="payment_method" class="w-full border rounded-lg p-3">

                    <option value="cash">
                        Cash
                    </option>

                    <option value="card">
                        Card
                    </option>

                    <option value="esewa">
                        eSewa
                    </option>

                    <option value="khalti">
                        Khalti
                    </option>

                </select>

            </div>



            <div>

                <label>
                    Paid Amount
                </label>


                <input type="number" step="0.01" name="paid_amount" value="{{ invoice.total }}"
                    class="w-full border rounded-lg p-3">

            </div>



            <button class="w-full bg-brand text-white rounded-lg py-3">

                Complete Payment

            </button>


        </form>


    </div>

</div>


{% endblock %}
