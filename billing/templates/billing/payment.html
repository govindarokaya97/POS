{% extends 'base.html' %}

{% block title %}
Payment
{% endblock %}


{% block content %}

<div class="mx-auto max-w-xl space-y-6">

    <!-- Header -->
    <div>
        <p class="font-mono text-xs uppercase tracking-[0.2em] text-muted">Billing</p>
        <h1 class="mt-1 font-display text-3xl font-semibold text-ink">Payment</h1>
        <p class="mt-1 text-sm text-muted">Choose how the customer is paying and confirm the amount.</p>
    </div>

    <form method="post" id="payment-form" class="space-y-6">
        {% csrf_token %}

        <!-- Amount due -->
        <div class="rounded-xl border border-line bg-white p-6 shadow-sm">
            <p class="text-xs font-semibold uppercase tracking-wider text-muted">Total amount</p>
            <h2 class="mt-1 font-mono text-4xl font-bold text-brand">Rs {{ invoice.total }}</h2>
        </div>

        <!-- Method -->
        <div class="rounded-xl border border-line bg-white p-6 shadow-sm">
            <p class="mb-3 text-sm font-semibold text-ink">Payment method</p>

            <div class="grid grid-cols-2 gap-3">

                <label class="cursor-pointer">
                    <input type="radio" name="payment_method" value="cash" class="peer sr-only" checked>
                    <div
                        class="flex items-center gap-3 rounded-lg border border-line px-4 py-3 transition
                                hover:bg-paper peer-checked:border-brand peer-checked:bg-brand/5
                                peer-checked:ring-2 peer-checked:ring-brand peer-focus-visible:ring-2 peer-focus-visible:ring-brand">
                        <i class="fa-solid fa-money-bill-wave text-brand"></i>
                        <span class="font-medium text-ink">Cash</span>
                    </div>
                </label>

                <label class="cursor-pointer">
                    <input type="radio" name="payment_method" value="card" class="peer sr-only">
                    <div
                        class="flex items-center gap-3 rounded-lg border border-line px-4 py-3 transition
                                hover:bg-paper peer-checked:border-brand peer-checked:bg-brand/5
                                peer-checked:ring-2 peer-checked:ring-brand peer-focus-visible:ring-2 peer-focus-visible:ring-brand">
                        <i class="fa-solid fa-credit-card text-brand"></i>
                        <span class="font-medium text-ink">Card</span>
                    </div>
                </label>

                <label class="cursor-pointer">
                    <input type="radio" name="payment_method" value="esewa" class="peer sr-only">
                    <div
                        class="flex items-center gap-3 rounded-lg border border-line px-4 py-3 transition
                                hover:bg-paper peer-checked:border-brand peer-checked:bg-brand/5
                                peer-checked:ring-2 peer-checked:ring-brand peer-focus-visible:ring-2 peer-focus-visible:ring-brand">
                        <i class="fa-solid fa-mobile-screen text-brand"></i>
                        <span class="font-medium text-ink">eSewa</span>
                    </div>
                </label>

                <label class="cursor-pointer">
                    <input type="radio" name="payment_method" value="khalti" class="peer sr-only">
                    <div
                        class="flex items-center gap-3 rounded-lg border border-line px-4 py-3 transition
                                hover:bg-paper peer-checked:border-brand peer-checked:bg-brand/5
                                peer-checked:ring-2 peer-checked:ring-brand peer-focus-visible:ring-2 peer-focus-visible:ring-brand">
                        <i class="fa-solid fa-wallet text-brand"></i>
                        <span class="font-medium text-ink">Khalti</span>
                    </div>
                </label>

            </div>
        </div>

        <!-- Amount received -->
        <div class="rounded-xl border border-line bg-white p-6 shadow-sm">

            <div class="flex items-center justify-between">
                <label for="paid_amount" class="text-sm font-semibold text-ink">Paid amount</label>
                <button type="button" id="pay-exact" class="text-sm font-semibold text-brand hover:underline">
                    Exact total
                </button>
            </div>

            <div class="relative mt-2">
                <span
                    class="pointer-events-none absolute inset-y-0 left-4 flex items-center font-mono text-muted">Rs</span>
                <input type="number" step="0.01" min="0" inputmode="decimal" id="paid_amount" name="paid_amount"
                    value="{{ invoice.total }}" class="w-full rounded-lg border border-line py-3 pl-12 pr-4 font-mono text-lg
                              focus:outline-none focus:ring-2 focus:ring-brand">
            </div>

            <div class="mt-4 flex items-center justify-between rounded-lg bg-paper px-4 py-3 text-sm">
                <span id="diff-label" class="text-muted">Change to return</span>
                <strong id="diff-amount" class="font-mono text-base text-ink">Rs 0.00</strong>
            </div>
        </div>

        <button type="submit" class="flex w-full items-center justify-center gap-2 rounded-lg bg-brand py-3.5 font-semibold
                       text-white shadow-sm transition hover:bg-brand-dark">
            <i class="fa-solid fa-check"></i>
            Complete Payment
        </button>

    </form>

</div>

<script>
    (function () {
        var total = parseFloat("{{ invoice.total }}") || 0;
        var paid = document.getElementById("paid_amount");
        var label = document.getElementById("diff-label");
        var amount = document.getElementById("diff-amount");

        function update() {
            var p = parseFloat(paid.value) || 0;
            var diff = p - total;

            if (diff >= 0) {
                label.textContent = "Change to return";
                amount.textContent = "Rs " + diff.toFixed(2);
                amount.className = "font-mono text-base text-ink";
            } else {
                label.textContent = "Balance due";
                amount.textContent = "Rs " + Math.abs(diff).toFixed(2);
                amount.className = "font-mono text-base text-red-600";
            }
        }

        paid.addEventListener("input", update);

        document.getElementById("pay-exact").addEventListener("click", function () {
            paid.value = total.toFixed(2);
            update();
        });

        update();
    })();
</script>

{% endblock %}
