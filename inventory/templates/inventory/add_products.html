{% extends 'base.html' %}
{% block title %}Add Product{% endblock title %}

{% block content %}
<div class="mx-auto max-w-4xl rounded-xl border border-line bg-white p-8 shadow-sm">
    <div class="mb-8">
        <p class="font-mono text-xs uppercase tracking-[0.2em] text-muted">Inventory</p>
        <h1 class="mt-1 font-display text-2xl font-semibold text-ink">Add Product</h1>
        <p class="mt-2 text-sm text-muted">Fill in the details below to add a new product to your inventory.</p>
    </div>

    <form class="space-y-6" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="grid gap-6 md:grid-cols-2">
            <div>
                <label for="name" class="mb-2 block text-sm font-medium text-ink">Product Name</label>
                <input type="text" id="name" name="name" placeholder="Enter product name"
                    class="w-full" />
            </div>

            <div>
                <label for="category" class="mb-2 block text-sm font-medium text-ink">Category</label>
                <select id="category" name="category">
                    <option value="">Select category</option>
                    <option value="1">Electronics</option>
                    <option value="2">Clothing</option>
                    <option value="3">Groceries</option>
                </select>
            </div>

            <div>
                <label for="price" class="mb-2 block text-sm font-medium text-ink">Price</label>
                <input type="number" id="price" name="price" step="0.01" placeholder="0.00"
                    class="w-full font-mono tabular-nums" />
            </div>

            <div>
                <label for="stock" class="mb-2 block text-sm font-medium text-ink">Stock</label>
                <input type="number" id="stock" name="stock" min="0" placeholder="Enter stock quantity"
                    class="w-full font-mono tabular-nums" />
            </div>
        </div>

        <div>
            <label for="description" class="mb-2 block text-sm font-medium text-ink">Description</label>
            <textarea id="description" name="description" rows="4" placeholder="Write a short product description"
                class="w-full"></textarea>
        </div>

        <div>
            <label for="image" class="mb-2 block text-sm font-medium text-ink">Product Image</label>
            <input type="file" id="image" name="image"
                class="w-full file:mr-4 file:rounded-md file:border-0 file:bg-ink file:px-4 file:py-2 file:text-sm file:font-medium file:text-white hover:file:bg-ink-2" />
        </div>
        <div>
            <label for="barcode" class="mb-2 block text-sm font-medium text-ink">
                Barcode
            </label>

            <input type="text" id="barcode" name="barcode" placeholder="Leave empty for automatic barcode"
                value="{{ form_data.barcode }}"
                class="w-full rounded-lg border border-line bg-paper px-4 py-3 text-sm text-ink outline-none transition focus:border-brand focus:ring-2 focus:ring-brand/20" />

            <p class="mt-1 text-xs text-muted">
                Leave blank to generate barcode automatically.
            </p>
        </div>
        <div class="flex items-center gap-3 rounded-xl border border-line bg-paper px-4 py-3">
            <input type="checkbox" id="is_available" name="is_available" checked
                class="h-4 w-4 rounded border-line text-brand focus:ring-brand" />
            <label for="is_available" class="text-sm text-ink">Available for sale</label>
        </div>

        <div class="flex items-center justify-end pt-2">
            <button type="submit"
                class="rounded-lg bg-brand px-5 py-3 text-sm font-semibold text-white transition hover:bg-brand-dark">
                Add Product
            </button>
        </div>
    </form>
</div>
{% endblock content %}
